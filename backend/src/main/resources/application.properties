spring.application.name=palette
server.port=${PORT:8081}

# Lets each developer keep their own secrets in backend/.env (git-ignored).
spring.config.import=optional:file:.env[.properties]

# ── Database ────────────────────────────────────────────────────────────────
# Values come from environment variables (see backend/.env.example).
# Defaults only cover the non-secret parts; DB_PASSWORD must be set.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/palette}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ── Schema ──────────────────────────────────────────────────────────────────
# Flyway owns the schema (src/main/resources/db/migration).
# Hibernate only checks that the entities match it and never alters tables.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── Logging ─────────────────────────────────────────────────────────────────
# Set SHOW_SQL=true to print the generated SQL while debugging.
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ── CORS ────────────────────────────────────────────────────────────────────
# Comma-separated list of frontend origins allowed to call the API.
palette.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
