# Tests run against an in-memory H2 database in PostgreSQL mode.
# The same Flyway migrations as production create and seed it, and
# ddl-auto=validate fails the build if an entity drifts from the schema.
spring.datasource.url=jdbc:h2:mem:palette;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

palette.cors.allowed-origins=http://localhost:5173
palette.jwt.secret=test-only-secret-that-is-at-least-32-characters-long
